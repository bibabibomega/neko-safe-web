<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản trị website két sắt</title>
<style>
  :root { --brand:#12284c; --accent:#e8590c; --bg:#f3f5f9; --line:#dde2ec; --ok:#1f9d55; --err:#c62828; --fg:#1b2433; --muted:#5b6678; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--fg); background:var(--bg); }
  header { background:var(--brand); color:#fff; padding:12px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:10; }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  header a, header button { color:#fff; }
  .wrap { max-width:1000px; margin:0 auto; padding:18px 16px 80px; }
  nav.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  nav.tabs button { padding:10px 18px; border:0; border-radius:10px 10px 0 0; background:#dfe5f1; cursor:pointer; font-weight:700; font-size:15px; color:var(--brand); }
  nav.tabs button.on { background:#fff; box-shadow:0 -2px 0 var(--accent) inset; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:0 12px 12px 12px; padding:20px; }
  h2 { margin:0 0 4px; font-size:20px; color:var(--brand); } h3 { margin:18px 0 8px; color:var(--brand); }
  .hint { color:var(--muted); font-size:13px; margin:2px 0 0; }
  .help { background:#eef4ff; border:1px solid #cfdcf7; border-radius:10px; padding:10px 14px; margin:10px 0 16px; font-size:14px; }
  .warn { background:#fff6e5; border:1px solid #f1d28b; border-radius:10px; padding:10px 14px; margin:10px 0; font-size:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .full { grid-column:1/-1; }
  label.f { display:block; font-weight:600; font-size:14px; }
  label.f > input, label.f > select, label.f > textarea { display:block; width:100%; margin-top:4px; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px; font:inherit; font-weight:400; background:#fff; }
  label.f > textarea { min-height:90px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  .chk { display:flex; gap:10px; align-items:flex-start; font-weight:600; }
  .chk input { width:20px; height:20px; margin-top:2px; }
  button.b { padding:10px 18px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; font-size:15px; }
  button.b.sec { background:#e6ebf5; color:var(--brand); } button.b.red { background:#fbe4e4; color:var(--err); }
  button.b.sm { padding:6px 12px; font-size:13px; } button.b:disabled { opacity:.55; cursor:wait; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:18px; }
  table { border-collapse:collapse; width:100%; } th, td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:middle; }
  th { font-size:13px; color:var(--muted); }
  td img, .thumb { width:56px; height:42px; object-fit:cover; border-radius:6px; background:#e4e9f3; display:block; }
  .tag { display:inline-block; background:#eef1f7; border-radius:999px; padding:1px 9px; font-size:12px; }
  .tag.off { background:#fde8e8; color:var(--err); }
  .pv { max-width:240px; max-height:180px; border-radius:10px; border:1px solid var(--line); display:block; margin-top:8px; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1b2433; color:#fff; padding:12px 20px; border-radius:10px; display:none; max-width:92vw; z-index:50; }
  #toast.ok { background:var(--ok); } #toast.err { background:var(--err); }
  pre.log { background:#0f172a; color:#cbd5e1; padding:12px; border-radius:10px; font-size:12px; white-space:pre-wrap; max-height:220px; overflow:auto; }
  .sec { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; background:#fafbfd; }
  @media (max-width:700px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Quản trị website két sắt</h1>
  <span id="pvstate" class="hint" style="color:#cfe0ff"></span>
  <button class="b sec sm" id="btnBuild">Cập nhật website xem thử</button>
  <a id="lnkSite" href="http://localhost:4399/" target="_blank" rel="noopener">Xem website ↗</a>
</header>
<div class="wrap">
  <nav class="tabs" id="tabs"></nav>
  <div class="panel" id="panel">Đang tải...</div>
  <pre class="log" id="log" style="display:none"></pre>
</div>
<div id="toast"></div>

<script>
const TABS = [['settings', 'Cửa hàng'], ['products', 'Sản phẩm'], ['articles', 'Tin tức'], ['policies', 'Chính sách']];
let D = null, tab = 'settings', editP = null, editA = null, polKey = null;

const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), kind === 'err' ? 7000 : 3500); }
async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Lỗi không xác định.');
  return j;
}
async function save(name) {
  try { await api('/api/save/' + name, 'PUT', D[name]); toast('Đã lưu. Bấm "Cập nhật website xem thử" để thấy thay đổi trên web.', 'ok'); return true; }
  catch (e) { toast(e.message, 'err'); return false; }
}
const slugify = (s) => s.toLowerCase().replace(/đ/g, 'd').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

// ---- ô nhập ----
function field(label, input, hint, cls) { return el('label', { class: 'f ' + (cls || '') }, label, input, hint ? el('div', { class: 'hint' }, hint) : null); }
const text = (v, on, ph) => el('input', { type: 'text', value: v ?? '', placeholder: ph || '', oninput: (e) => on(e.target.value) });
const num = (v, on) => el('input', { type: 'number', step: 'any', min: 0, value: v ?? 0, oninput: (e) => on(e.target.value === '' ? NaN : Number(e.target.value)) });
const area = (v, on, rows) => el('textarea', { rows: rows || 4, oninput: (e) => on(e.target.value) }, v ?? '');
const lines = (s) => s.split('\n').map((x) => x.trim()).filter(Boolean);
function check(label, v, on, hint) { return el('label', { class: 'chk' }, el('input', { type: 'checkbox', checked: !!v, onchange: (e) => on(e.target.checked) }), el('span', {}, label, hint ? el('div', { class: 'hint' }, hint) : null)); }
function select(v, opts, on) { const s = el('select', { onchange: (e) => on(e.target.value) }, opts.map(([val, lab]) => el('option', { value: val, selected: val === v }, lab))); return s; }

// ---- Tab: Cửa hàng ----
function viewSettings() {
  const s = D.settings; const a = s.address;
  return el('div', {},
    el('h2', {}, 'Thông tin cửa hàng'),
    el('div', { class: 'help' }, 'Sửa ở đây thì mọi trang trên website tự đổi theo: tên, số điện thoại, Zalo, tên miền.'),
    el('div', { class: 'grid' },
      field('Tên cửa hàng', text(s.name, (v) => (s.name = v))),
      field('Tên thương hiệu bán', text(s.brand, (v) => (s.brand = v)), 'Ví dụ Neko Safe'),
      field('Tên miền website', text(s.url, (v) => (s.url = v), 'https://tenmiencuaban.vn'), 'Khi chưa có tên miền thì để nguyên https://example.com'),
      field('Email nhận ĐƠN HÀNG và yêu cầu tư vấn', text(s.leadEmail, (v) => (s.leadEmail = v)), 'Mọi đơn khách đặt gửi về đây (Gmail). Email này không hiện trên web.'),
      field('Số hotline gọi (mỗi dòng một số)', area(s.phones.join('\n'), (v) => (s.phones = lines(v)), 2), 'Ví dụ 0343.989.989'),
      field('Số Zalo', text(s.zalo, (v) => (s.zalo = v)), 'Để trống thì ẩn nút Chat Zalo'),
      field('Email hiển thị công khai trên web (không bắt buộc)', text(s.email, (v) => (s.email = v)), 'Để trống nếu không muốn hiện email'),
      field('Ảnh chia sẻ mạng xã hội', text(s.ogImage, (v) => (s.ogImage = v)), 'Ảnh 1200x630 đặt trong thư mục public. Ví dụ /og-default.png'),
      field('Địa chỉ (số nhà, đường)', text(a.street, (v) => (a.street = v)), 'Để trống nếu chỉ bán online'),
      field('Tỉnh / thành phố', text(a.city, (v) => (a.city = v))),
      field('Mạng xã hội của bạn (mỗi dòng một link)', area(s.sameAs.join('\n'), (v) => (s.sameAs = lines(v)), 2), 'Facebook, YouTube của cửa hàng bạn. Chỉ điền trang CỦA BẠN.', 'full'),
    ),
    el('h3', {}, 'Cho Google lập chỉ mục'),
    el('div', { class: 'warn' }, 'Đang làm tạm thì để TẮT. Chỉ bật khi đã có tên miền thật và đã điền hết giá, chính sách, ảnh (không còn chữ trong ngoặc vuông [..]).'),
    check('Cho phép Google tìm thấy website này', s.indexable, (v) => (s.indexable = v), 'Tắt = website bị ẩn khỏi Google.'),
    el('div', { class: 'bar' }, el('button', { class: 'b', onclick: () => save('settings') }, 'Lưu thông tin cửa hàng')),
  );
}

// ---- Tab: Sản phẩm ----
const COLORS = ['Đen', 'Trắng', 'Đỏ', 'Xanh', 'Hồng', 'Nâu'];
const GL = { mini: 'Két mini', 'gia-dinh': 'Két gia đình', 'van-tay': 'Két vân tay' };
const money = (n) => (n ? new Intl.NumberFormat('vi-VN').format(n) + ' ₫' : 'Liên hệ');
function blankProduct() { return { slug: '', code: '', brand: D.settings.brand || 'Neko Safe', name: '', group: 'gia-dinh', lock: 'Khóa điện tử', weight: 10, dims: [300, 380, 320], colors: ['Đen'], price: 0, oldPrice: 0, image: '', tagline: '', hidden: false, _new: true }; }

function viewProducts() {
  if (editP) return editProduct();
  const ps = D.products;
  return el('div', {},
    el('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' }, el('h2', { style: 'margin:0 auto 0 0' }, `Sản phẩm (${ps.length})`),
      el('button', { class: 'b', onclick: () => { editP = blankProduct(); render(); } }, '+ Đăng sản phẩm mới')),
    el('div', { class: 'help' }, 'Thứ tự ở đây là thứ tự trên website. 8 sản phẩm đầu tiên hiện ở "Mẫu được quan tâm" trên trang chủ. Dùng nút ↑ ↓ để sắp xếp, nhớ bấm Lưu thứ tự.'),
    el('div', { style: 'overflow-x:auto' }, el('table', {},
      el('thead', {}, el('tr', {}, ['', 'Mẫu', 'Nhóm', 'Nặng', 'Giá', '', ''].map((h) => el('th', {}, h)))),
      el('tbody', {}, ps.map((p, i) => el('tr', {},
        el('td', {}, p.image ? el('img', { src: p.image, alt: '' }) : el('div', { class: 'thumb' })),
        el('td', {}, el('b', {}, p.name || `${p.brand} ${p.code}`), p.hidden ? [' ', el('span', { class: 'tag off' }, 'đang ẩn')] : null),
        el('td', {}, GL[p.group]), el('td', {}, p.weight + ' kg'), el('td', {}, money(p.price)),
        el('td', {}, el('button', { class: 'b sec sm', onclick: () => move(i, -1) }, '↑'), ' ', el('button', { class: 'b sec sm', onclick: () => move(i, 1) }, '↓')),
        el('td', {}, el('button', { class: 'b sm', onclick: () => { editP = JSON.parse(JSON.stringify(p)); editP._i = i; render(); } }, 'Sửa'), ' ',
          el('button', { class: 'b red sm', onclick: () => delProduct(i) }, 'Xóa')),
      )))),
    ),
    el('div', { class: 'bar' }, el('button', { class: 'b', onclick: () => save('products') }, 'Lưu thứ tự')),
  );
}
function move(i, d) { const a = D.products, j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; render(); }
async function delProduct(i) {
  if (!confirm(`Xóa "${D.products[i].code}"? Có thể ẩn thay vì xóa. (Bản sao lưu vẫn còn trong thư mục src/data/.backup)`)) return;
  D.products.splice(i, 1); if (await save('products')) render();
}
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => reject(new Error('Không đọc được ảnh này.'));
    img.src = url;
  });
}
function editProduct() {
  const p = editP; let slugTouched = !p._new;
  const pv = el('img', { class: 'pv', src: p.image || '', alt: '', style: p.image ? '' : 'display:none' });
  const slugIn = text(p.slug, (v) => { p.slug = v; slugTouched = true; }, 'ket-sat-neko-safe-ns20');
  const colorBox = el('div', { style: 'display:flex;gap:12px;flex-wrap:wrap;margin-top:6px' }, COLORS.map((c) =>
    el('label', { class: 'chk', style: 'font-weight:400' }, el('input', { type: 'checkbox', checked: p.colors.includes(c), onchange: (e) => { p.colors = e.target.checked ? [...p.colors, c] : p.colors.filter((x) => x !== c); } }), c)));
  const fileIn = el('input', { type: 'file', accept: 'image/*', onchange: async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { toast('Đang tải ảnh...'); const dataUrl = await resizeImage(f);
      const r = await api('/api/upload', 'POST', { filename: (p.code || 'anh') + '-' + f.name, dataUrl });
      p.image = r.path; pv.src = r.path + '?' + Date.now(); pv.style.display = ''; toast('Đã tải ảnh lên: ' + r.path, 'ok');
    } catch (err) { toast(err.message, 'err'); } } });
  return el('div', {},
    el('h2', {}, p._new ? 'Đăng sản phẩm mới' : 'Sửa sản phẩm ' + p.code),
    el('div', { class: 'help' }, 'Giá để 0 thì website hiện "Liên hệ báo giá". Thông số nên đối chiếu với catalogue chính hãng.'),
    el('div', { class: 'grid' },
      field('Mã mẫu *', text(p.code, (v) => { p.code = v; if (!slugTouched) { p.slug = slugify(`ket sat ${p.brand} ${v}`); slugIn.value = p.slug; } }, 'Ví dụ NS20')),
      field('Thương hiệu', text(p.brand, (v) => (p.brand = v))),
      field('Tên hiển thị (không bắt buộc)', text(p.name, (v) => (p.name = v), 'Để trống sẽ tự đặt: Két sắt [Thương hiệu] [Mã]'), 'Chỉ điền khi muốn đặt tên riêng.', 'full'),
      field('Nhóm', select(p.group, Object.entries(GL), (v) => (p.group = v)), 'Quyết định mục lọc trên trang Sản phẩm'),
      field('Loại khóa', text(p.lock, (v) => (p.lock = v), 'Khóa điện tử'), 'Ví dụ: Khóa điện tử / Khóa vân tay + mã số + chìa cơ'),
      field('Khối lượng (kg)', num(p.weight, (v) => (p.weight = v))),
      field('Mô tả ngắn một câu', text(p.tagline, (v) => (p.tagline = v), 'Nhỏ gọn, hợp để trong tủ hoặc ngăn kéo.')),
      field('Kích thước: dài (mm)', num(p.dims[0], (v) => (p.dims[0] = v))),
      field('Kích thước: rộng (mm)', num(p.dims[1], (v) => (p.dims[1] = v))),
      field('Kích thước: cao (mm)', num(p.dims[2], (v) => (p.dims[2] = v))),
      field('Giá bán (VNĐ)', num(p.price, (v) => (p.price = v)), '0 = Liên hệ báo giá'),
      field('Giá gốc để gạch ngang (VNĐ)', num(p.oldPrice, (v) => (p.oldPrice = v)), '0 = không hiển thị'),
      el('div', { class: 'full' }, el('b', {}, 'Màu sắc có sẵn'), colorBox),
      field('Đường dẫn trang (tự tạo từ mã mẫu)', slugIn, 'Chỉ chữ thường, số, dấu gạch. Đổi sẽ làm đổi địa chỉ trang.', 'full'),
      el('div', { class: 'full' }, field('Ảnh sản phẩm', fileIn, 'Chọn ảnh JPG/PNG. Tự thu nhỏ còn tối đa 1000px để web tải nhanh. Chưa có ảnh thì web dùng hình minh họa.'), pv,
        p.image ? el('div', { class: 'bar' }, el('button', { class: 'b red sm', onclick: () => { p.image = ''; pv.style.display = 'none'; } }, 'Bỏ ảnh')) : null),
      el('div', { class: 'full' }, check('Ẩn sản phẩm này khỏi website (hết hàng, tạm ngưng)', p.hidden, (v) => (p.hidden = v))),
    ),
    el('div', { class: 'bar' },
      el('button', { class: 'b', onclick: saveProduct }, p._new ? 'Đăng sản phẩm' : 'Lưu sản phẩm'),
      el('button', { class: 'b sec', onclick: () => { editP = null; render(); } }, 'Quay lại danh sách')),
  );
}
async function saveProduct() {
  const p = editP; const clean = { ...p }; delete clean._new; delete clean._i;
  clean.code = clean.code.trim(); clean.brand = clean.brand.trim(); clean.name = clean.name.trim(); clean.tagline = clean.tagline.trim();
  if (!clean.slug) clean.slug = slugify(`ket sat ${clean.brand} ${clean.code}`);
  const arr = D.products.slice();
  if (p._new) arr.push(clean); else arr[p._i] = clean;
  const prev = D.products; D.products = arr;
  if (await save('products')) { editP = null; render(); } else D.products = prev;
}

// ---- Tab: Tin tức ----
function toText(blocks) {
  return blocks.map((b) => b.t === 'h2' ? '## ' + b.v : b.t === 'p' ? b.v : b.t === 'ul' ? b.v.map((x) => '- ' + x).join('\n') : b.t === 'compare' ? '[BẢNG SO SÁNH]' : '[NÚT TƯ VẤN]').join('\n\n');
}
function fromText(t) {
  const out = []; let ul = null;
  for (const raw of t.split('\n')) {
    const l = raw.trim();
    if (l.startsWith('- ')) { if (!ul) { ul = { t: 'ul', v: [] }; out.push(ul); } ul.v.push(l.slice(2).trim()); continue; }
    ul = null;
    if (!l) continue;
    if (l.startsWith('## ')) out.push({ t: 'h2', v: l.slice(3).trim() });
    else if (l === '[BẢNG SO SÁNH]') out.push({ t: 'compare' });
    else if (l === '[NÚT TƯ VẤN]') out.push({ t: 'cta' });
    else out.push({ t: 'p', v: l });
  }
  return out;
}
function viewArticles() {
  if (editA) return editArticle();
  const as = D.articles.slice().sort((a, b) => b.date.localeCompare(a.date));
  return el('div', {},
    el('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' }, el('h2', { style: 'margin:0 auto 0 0' }, `Tin tức (${as.length})`),
      el('button', { class: 'b', onclick: () => { editA = { slug: '', title: '', description: '', date: new Date().toISOString().slice(0, 10), readMin: 3, tag: 'Kinh nghiệm', blocks: [], _new: true, _text: '' }; render(); } }, '+ Viết bài mới')),
    el('div', { class: 'help' }, 'Bài đánh giá, so sánh, hướng dẫn giúp khách tin tưởng và giúp web lên Google. Bài mới nhất hiện đầu tiên.'),
    el('table', {}, el('thead', {}, el('tr', {}, ['Tiêu đề', 'Chuyên mục', 'Ngày', '', ''].map((h) => el('th', {}, h)))),
      el('tbody', {}, as.map((a) => el('tr', {}, el('td', {}, el('b', {}, a.title)), el('td', {}, el('span', { class: 'tag' }, a.tag)), el('td', {}, a.date),
        el('td', {}, el('button', { class: 'b sm', onclick: () => { editA = JSON.parse(JSON.stringify(a)); editA._text = toText(a.blocks); editA._slug0 = a.slug; render(); } }, 'Sửa')),
        el('td', {}, el('button', { class: 'b red sm', onclick: () => delArticle(a.slug) }, 'Xóa')))))),
  );
}
async function delArticle(slug) {
  if (!confirm('Xóa bài viết này?')) return;
  D.articles = D.articles.filter((a) => a.slug !== slug); if (await save('articles')) render();
}
function editArticle() {
  const a = editA; let slugTouched = !a._new;
  const slugIn = text(a.slug, (v) => { a.slug = v; slugTouched = true; });
  return el('div', {},
    el('h2', {}, a._new ? 'Viết bài mới' : 'Sửa bài viết'),
    el('div', { class: 'grid' },
      field('Tiêu đề bài *', text(a.title, (v) => { a.title = v; if (!slugTouched) { a.slug = slugify(v); slugIn.value = a.slug; } }), 'Nên có từ khóa người mua hay tìm, ví dụ "két sắt vân tay có tốt không".', 'full'),
      field('Mô tả ngắn cho Google (dưới 160 ký tự)', area(a.description, (v) => (a.description = v), 2), 'Hiện dưới tiêu đề khi tìm trên Google.', 'full'),
      field('Chuyên mục', text(a.tag, (v) => (a.tag = v)), 'Đánh giá / Kinh nghiệm / So sánh / Hướng dẫn'),
      field('Ngày đăng', el('input', { type: 'date', value: a.date, oninput: (e) => (a.date = e.target.value) })),
      field('Thời gian đọc (phút)', num(a.readMin, (v) => (a.readMin = v))),
      field('Đường dẫn bài (tự tạo từ tiêu đề)', slugIn),
      field('Nội dung bài', area(a._text, (v) => (a._text = v), 18), null, 'full'),
    ),
    el('div', { class: 'help' }, el('b', {}, 'Cách viết: '), 'mỗi đoạn một dòng. Tiêu đề phụ bắt đầu bằng ', el('code', {}, '## '), '. Danh sách gạch đầu dòng bắt đầu bằng ', el('code', {}, '- '), '. Gõ ', el('code', {}, '[BẢNG SO SÁNH]'), ' để chèn bảng thông số các mẫu, ', el('code', {}, '[NÚT TƯ VẤN]'), ' để chèn khung gọi tư vấn.'),
    el('div', { class: 'bar' },
      el('button', { class: 'b', onclick: saveArticle }, a._new ? 'Đăng bài' : 'Lưu bài'),
      el('button', { class: 'b sec', onclick: () => { editA = null; render(); } }, 'Quay lại danh sách')),
  );
}
async function saveArticle() {
  const a = editA; const clean = { slug: a.slug || slugify(a.title), title: a.title.trim(), description: a.description.trim(), date: a.date, readMin: a.readMin || 3, tag: a.tag.trim() || 'Tin tức', blocks: fromText(a._text) };
  if (!clean.blocks.length) { toast('Bài viết chưa có nội dung.', 'err'); return; }
  const arr = D.articles.filter((x) => x.slug !== (a._slug0 || ''));
  arr.push(clean);
  const prev = D.articles; D.articles = arr;
  if (await save('articles')) { editA = null; render(); } else D.articles = prev;
}

// ---- Tab: Chính sách ----
const PNAME = { 'thanh-toan': 'Thanh toán', 'van-chuyen': 'Vận chuyển', 'bao-hanh': 'Bảo hành', 'doi-tra': 'Đổi trả', 'bao-mat': 'Bảo mật' };
function viewPolicies() {
  const keys = Object.keys(D.policies); polKey = polKey && D.policies[polKey] ? polKey : keys[0];
  const p = D.policies[polKey];
  return el('div', {},
    el('h2', {}, 'Trang chính sách'),
    el('div', { class: 'help' }, 'Những chỗ còn chữ trong ngoặc vuông [..] là chỗ BẠN cần điền thông tin thật (thời gian bảo hành, phí giao, số tài khoản...). Có thể gõ {{hotline}} và {{zalo}} để tự chèn số điện thoại.'),
    el('div', { class: 'grid' },
      field('Chọn trang', select(polKey, keys.map((k) => [k, PNAME[k] || k]), (v) => { polKey = v; render(); })),
      field('Tiêu đề trang (hiện trên Google)', text(p.title, (v) => (p.title = v))),
      field('Mô tả ngắn cho Google', area(p.description, (v) => (p.description = v), 2), null, 'full'),
      field('Tiêu đề lớn trong trang', text(p.h1, (v) => (p.h1 = v)), null, 'full')),
    el('h3', {}, 'Các mục'),
    p.blocks.map((b, i) => el('div', { class: 'sec' },
      field('Tên mục', text(b.h, (v) => (b.h = v))),
      el('div', { style: 'height:8px' }),
      field('Nội dung (mỗi dòng một ý)', area(b.items.join('\n'), (v) => (b.items = lines(v)), 4)),
      el('div', { class: 'bar' }, el('button', { class: 'b red sm', onclick: () => { if (confirm('Xóa mục này?')) { p.blocks.splice(i, 1); render(); } } }, 'Xóa mục')))),
    el('div', { class: 'bar' },
      el('button', { class: 'b sec', onclick: () => { p.blocks.push({ h: 'Mục mới', items: [''] }); render(); } }, '+ Thêm mục'),
      el('button', { class: 'b', onclick: () => save('policies') }, 'Lưu chính sách')),
  );
}

// ---- khung chung ----
function render() {
  const nav = $('#tabs'); nav.replaceChildren(...TABS.map(([k, l]) => el('button', { class: k === tab ? 'on' : '', onclick: () => { tab = k; editP = null; editA = null; render(); } }, l)));
  const v = { settings: viewSettings, products: viewProducts, articles: viewArticles, policies: viewPolicies }[tab]();
  $('#panel').replaceChildren(v);
}
$('#btnBuild').addEventListener('click', async () => {
  const b = $('#btnBuild'); b.disabled = true; b.textContent = 'Đang cập nhật...';
  try { const r = await api('/api/build', 'POST', {}); const log = $('#log'); log.style.display = 'block'; log.textContent = r.output;
    toast(r.ok ? 'Đã cập nhật website. Tải lại trang xem thử là thấy.' : 'Cập nhật bị lỗi, xem khung nhật ký bên dưới.', r.ok ? 'ok' : 'err');
  } catch (e) { toast(e.message, 'err'); }
  b.disabled = false; b.textContent = 'Cập nhật website xem thử'; status();
});
async function status() { try { const s = await api('/api/status'); $('#pvstate').textContent = s.previewUp ? '● website xem thử đang chạy' : '○ website xem thử chưa chạy'; $('#lnkSite').href = s.previewUrl; } catch {} }
(async () => {
  try { D = await api('/api/all'); render(); status(); }
  catch (e) { $('#panel').textContent = 'Không tải được dữ liệu: ' + e.message; }
})();
window.addEventListener('beforeunload', (e) => { if (editP || editA) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
